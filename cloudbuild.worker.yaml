steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.worker
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/agents/promptpulse-worker:latest
      - .
images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/agents/promptpulse-worker:latest
options:
  logging: CLOUD_LOGGING_ONLY
